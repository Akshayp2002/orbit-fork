name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Render overlay offscreen
        run: python tools/render_overlay.py overlay-${{ matrix.os }}
      - name: macOS API smoke test
        if: runner.os == 'macOS'
        run: python tools/mac_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-${{ matrix.os }}
          path: overlay-*.png

  android:
    if: ${{ hashFiles('android/gradlew') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
