name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Render overlay offscreen
        run: python tools/render_overlay.py overlay-${{ matrix.os }}
      - name: macOS API smoke test
        if: runner.os == 'macOS'
        run: python -u tools/mac_smoke.py
      - name: Full app starts and handles injected dial events
        run: python -u tools/startup_check.py
      - name: Build Orbit.app
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyinstaller
          bash packaging/mac/build_app.sh
          ditto -c -k --keepParent dist/Orbit.app Orbit-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-${{ matrix.os }}
          path: overlay-*.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Orbit-macos
          path: Orbit-macos.zip
