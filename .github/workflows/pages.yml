name: pages

# Publishes site/ (the download page) to GitHub Pages: https://harsha20599.github.io/orbit/
# Needs Settings > Pages > Source = GitHub Actions (and a public repo on the free plan).
on:
  push:
    branches: [main]
    paths: ["site/**", "orbit/ui/icons/orbit.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp orbit/ui/icons/orbit.png site/orbit.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
