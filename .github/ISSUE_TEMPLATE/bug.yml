name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Device
      options: [Windows, macOS, Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit version
      placeholder: e.g. 0.1.0
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "e.g. Turning the dial in Scroll does nothing in Chrome"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (the last ~50 lines)
      description: "Windows: tray icon → Open log. macOS: ~/.orbit/orbit.log. Android: copy from the setup screen."
      render: text
